<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me - Jay Malde</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans text-gray-800">

    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-gray-200">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-gray-900">Jay Malde</a>
            <div class="hidden md:flex items-center space-x-8">
                 <a href="index.html" class="text-gray-600 hover:text-blue-600">Home</a>
                 <a href="portfolio.html" class="text-gray-600 hover:text-blue-600">Portfolio</a>
            </div>
            <a href="index.html" class="text-gray-600 hover:text-blue-600 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
                </svg>
                Back to Home
            </a>
        </nav>
    </header>

    <main class="container mx-auto px-6 py-16">
        <div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow-md">
            <div class="text-center mb-8">
                <h1 class="text-4xl font-bold text-blue-600">Get In Touch</h1>
                <p class="mt-2 text-gray-600">Have a project in mind or just want to say hello? I'd love to hear from you.</p>
            </div>

            <form action="https://formspree.io/f/movkjeao" method="POST">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700">Full Name</label>
                        <input type="text" name="name" id="name" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
                        <input type="email" name="email" id="email" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                    </div>
                </div>
                <div class="mt-6">
                    <label for="subject" class="block text-sm font-medium text-gray-700">Subject</label>
                    <input type="text" name="subject" id="subject" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div class="mt-6">
                    <label for="message" class="block text-sm font-medium text-gray-700">Message</label>
                    <textarea id="message" name="message" rows="5" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500"></textarea>
                </div>
                <div class="mt-8 text-center">
                    <button type="submit" class="w-full md:w-auto inline-flex justify-center py-3 px-12 border border-transparent shadow-sm text-base font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                        Send Message
                    </button>
                </div>
            </form>
        </div>
    </main>

    <footer class="bg-gray-900 text-gray-400 mt-20">
        <div class="container mx-auto px-6 py-8">
            <div class="flex flex-col md:flex-row justify-between items-center">
                <div>
                    <h3 class="text-xl font-bold text-white">Jay Malde</h3>
                    <p class="text-sm">Salesforce Consultant & AppExchange Developer</p>
                </div>
                <div class="flex items-center space-x-6 mt-4 md:mt-0">
                    <a href="mailto:jaymalde0@gmail.com" class="hover:text-white">jaymalde0@gmail.com</a>
                    <a href="https://www.linkedin.com/in/jaymalde" class="hover:text-white">linkedin.com/in/jaymalde</a>
                </div>
            </div>
            <div class="mt-8 border-t border-gray-800 pt-6 text-center text-sm">
                <p>&copy; 2025 Jay Malde. All rights reserved. | <a href="#" class="hover:text-white">Privacy Policy</a></p>
            </div>
        </div>
    </footer>

</body>
</html>
